name: Deploy

run-name: Deploy branch/ref ${{ github.event.workflow_run.head_branch || github.ref_name }}

on:
  workflow_dispatch: {}
  workflow_run:
    workflows: [CI]
    types: [completed]
  
jobs: 
  pages-url:
    name: Get Pages URL
    runs-on: ubuntu-latest
    permissions:
      pages: read
    outputs:
      url: ${{ steps.pages.outputs.url }}
      preview_url: ${{ steps.pages.outputs.url }}previews/pr-${{ github.event.workflow_run.pull_requests[0].number }}/
    steps:
      - name: Look up URL
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url=$(gh api "repos/${{ github.repository }}/pages" --jq .html_url)
          echo "url=${url}" >> "$GITHUB_OUTPUT"

  build-and-deploy:
    name: Publish main
    environment:
      name: github-pages
      url: ${{ needs.pages-url.outputs.url }}
    runs-on: ubuntu-latest
    needs: pages-url
    if: |
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    concurrency:
      group: gh-pages
      queue: max
    permissions: 
      contents: write
    steps: 
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
      - name: Install dependencies
        run: |
          gem install bundler
          bundle install
      - name: Build
        run: bundle exec rake build
      - name: Get current pages
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          path: gh-pages-content
      - name: Preserve previews
        run: |
          if [ -d gh-pages-content/previews ]; then
            cp -R gh-pages-content/previews build/
          fi
      - name: Publish main site
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build

  build-pr-preview:
    name: Build preview
    runs-on: ubuntu-latest
    needs: pages-url
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      !startsWith(github.event.workflow_run.head_branch, 'dependabot/') &&
      github.event.workflow_run.pull_requests[0].number != ''
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
      - name: Install dependencies
        run: |
          gem install bundler
          bundle install
      - name: Build
        env:
          PREVIEW: "true"
          PREVIEW_URL: ${{ needs.pages-url.outputs.preview_url }}
        run: bundle exec rake build
      - name: Upload preview site
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pr-preview-${{ github.event.workflow_run.id }}
          path: build/
          if-no-files-found: error

  deploy-pr-preview:
    name: Publish preview
    runs-on: ubuntu-latest
    needs: [pages-url, build-pr-preview]
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      !startsWith(github.event.workflow_run.head_branch, 'dependabot/') &&
      github.event.workflow_run.pull_requests[0].number != ''
    concurrency:
      group: gh-pages
      queue: max
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Download preview site
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pr-preview-${{ github.event.workflow_run.id }}
          path: build/
      - name: Publish preview site
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build
          destination_dir: previews/pr-${{ github.event.workflow_run.pull_requests[0].number }}
      - name: Comment preview link on pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          PREVIEW_URL: ${{ needs.pages-url.outputs.preview_url }}
        run: |
          existing=$(gh pr view "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --json comments \
            --jq '[.comments[] | select(.body | contains(env.PREVIEW_URL))] | length')

          if [ "$existing" = "0" ]; then
            gh pr comment "$PR_NUMBER" \
              --repo "$GITHUB_REPOSITORY" \
              --body "Pull request preview: $PREVIEW_URL"
          fi
