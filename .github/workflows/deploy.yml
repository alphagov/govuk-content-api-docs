name: Deploy

run-name: Deploy ${{ github.event.workflow_run.head_branch }} site

on:
  workflow_dispatch: {}
  workflow_run:
    workflows: [CI]
    types: [completed]
  pull_request_target:
    types: [closed]
  
jobs: 
  pages-info:
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.pages.outputs.url }}
    steps:
      - name: Get pages URL
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "url=$(gh api repos/${{ github.repository }}/pages --jq .html_url)" >> "$GITHUB_OUTPUT"

  build-and-deploy:
    name: Publish main
    runs-on: ubuntu-latest
    needs: pages-info
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    environment:
      name: github-pages
      url: ${{ needs.pages-info.outputs.url }}
    permissions: 
      contents: write
    steps: 
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
      - name: Install dependencies
        run: |
          gem install bundler
          bundle install
      - name: Build
        run: bundle exec rake build
      - name: Get current pages
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          path: gh-pages-content
      - name: Preserve previews
        run: |
          if [ -d gh-pages-content/previews ]; then
            cp -R gh-pages-content/previews build/
          fi
      - name: Publish main site
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build

  build-pr-preview:
    name: Build preview
    runs-on: ubuntu-latest
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
      - name: Install dependencies
        run: |
          gem install bundler
          bundle install
      - name: Build
        run: bundle exec rake build
      - name: Upload preview site
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pr-preview-${{ github.event.workflow_run.id }}
          path: build/
          if-no-files-found: error

  deploy-pr-preview:
    name: Publish preview
    runs-on: ubuntu-latest
    needs: [pages-info, build-pr-preview]
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    environment:
      name: github-pages-pr-${{ github.event.workflow_run.pull_requests[0].number }}
      url: ${{ needs.pages-info.outputs.url }}previews/pr-${{ github.event.workflow_run.pull_requests[0].number }}
    permissions:
      contents: write
    steps:
      - name: Download preview site
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pr-preview-${{ github.event.workflow_run.id }}
          path: build/
      - name: Publish preview site
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build
          destination_dir: previews/pr-${{ github.event.workflow_run.pull_requests[0].number }}

  remove-pr-preview:
    name: Remove preview
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request_target' && github.event.action == 'closed'
    permissions:
      contents: write
      deployments: write
    steps:
      - name: Create empty directory
        run: mkdir empty
      - name: Remove preview site
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: empty
          destination_dir: previews/pr-${{ github.event.pull_request.number }}
      - name: Mark preview deployment inactive
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_ENV_NAME: github-pages-pr-${{ github.event.pull_request.number }}
        run: |
          deployment_id=$(gh api \
            "repos/${GITHUB_REPOSITORY}/deployments?environment=${PREVIEW_ENV_NAME}&per_page=1" \
            --jq '.[0].id // empty')

          if [ -n "$deployment_id" ]; then
            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/deployments/${deployment_id}/statuses" \
              -f state=inactive
          fi
