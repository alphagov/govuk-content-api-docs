version: 2
updates:
  - package-ecosystem: bundler
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: "07:00"
    allow:
      - dependency-type: direct
    ignore:
      - dependency-name: "govuk_tech_docs"
        versions: ["~> 6.5.0"]
    cooldown:
      default-days: 3
    open-pull-requests-limit: 25

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: "07:00"
    cooldown:
      default-days: 3
    open-pull-requests-limit: 25
